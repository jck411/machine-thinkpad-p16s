# Stable MAC per SSID — captive portals need a consistent MAC to track
# your session across auth steps. "stable" derives a persistent per-SSID
# MAC from the device MAC + SSID, so it's different from your real MAC but
# doesn't rotate mid-session like "random" would.
# Connectivity check — NM detects captive portals and marks the connection
# as "portal" so your browser can open the login page.
# Deployed to /etc/NetworkManager/conf.d/ by setup.sh
[connection]
wifi.cloned-mac-address=stable

[connectivity]
uri=http://connectivity-check.ubuntu.com/
response=NetworkManager is online
interval=300
